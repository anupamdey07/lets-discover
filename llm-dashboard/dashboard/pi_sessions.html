<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Sessions · GB10</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #21262d; --border: #30363d;
  --text: #c9d1d9; --text2: #8b949e; --text3: #484f58;
  --accent: #58a6ff; --green: #3fb950; --orange: #d29922; --red: #f85149;
  --purple: #bc8cff; --cyan: #39d2c0; --yellow: #dbb81a; --gray: #6e7681;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
.btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.78rem; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.breadcrumb { font-size: 0.78rem; color: var(--text2); margin-bottom: 16px; }
.breadcrumb span { cursor: pointer; }
.breadcrumb span:hover { color: var(--accent); text-decoration: underline; }
.breadcrumb .sep { margin: 0 6px; color: var(--text3); }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: border-color 0.15s; }
.tile:hover { border-color: var(--accent); }
.tile-name { font-size: 0.85rem; margin-bottom: 4px; word-break: break-all; }
.tile-cwd { font-size: 0.72rem; color: var(--accent); margin-bottom: 6px; }
.tile-count { font-size: 0.72rem; color: var(--text2); }
.session-list { display: flex; flex-direction: column; gap: 4px; }
.session-row { display: grid; grid-template-columns: 1fr 100px 60px; gap: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 0.78rem; align-items: start; }
.session-row:hover { border-color: var(--accent); background: var(--surface2); }
.session-id { font-family: monospace; color: var(--accent); word-break: break-all; font-size: 0.72rem; line-height: 1.4; }
.session-brief { color: var(--text); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.session-time { color: var(--text2); font-size: 0.7rem; text-align: right; white-space: nowrap; }
.session-entries { color: var(--text3); text-align: center; display: none; }
.group { margin-bottom: 16px; }
.group-header { font-size: 0.82rem; font-weight: 600; padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.group-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
.group-badge.user { background: rgba(88,166,255,0.15); color: var(--accent); }
.group-badge.assistant { background: rgba(63,185,80,0.15); color: var(--green); }
.group-badge.toolCall { background: rgba(210,153,34,0.15); color: var(--orange); }
.group-badge.thinking { background: rgba(188,140,255,0.15); color: var(--purple); }
.group-badge.toolResult { background: rgba(219,184,26,0.15); color: var(--yellow); }
.group-badge.custom { background: rgba(57,210,192,0.15); color: var(--cyan); }
.group-badge.compaction { background: rgba(248,81,73,0.15); color: var(--red); }
.group-badge.other { background: rgba(110,118,129,0.15); color: var(--gray); }
.brief { font-size: 0.78rem; padding: 6px 12px; margin: 2px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.15s; }
.brief:hover { background: var(--surface2); }
.brief.expanded { white-space: normal; overflow: visible; text-overflow: clip; }
.brief-full { display: none; margin-top: 4px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; font-size: 0.75rem; white-space: pre-wrap; font-family: monospace; line-height: 1.5; max-height: 400px; overflow-y: auto; }
.brief.expanded + .brief-full { display: block; }
.back-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.78rem; cursor: pointer; margin-bottom: 12px; }
.back-btn:hover { border-color: var(--accent); }
.loading { color: var(--text2); text-align: center; padding: 40px; }
.error { color: var(--red); text-align: center; padding: 20px; }
.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="header">
  <h1>📋 Pi Sessions</h1>
  <button class="btn" onclick="refresh()">⟳ Refresh</button>
</div>
<div class="breadcrumb" id="breadcrumb"></div>
<div class="controls" id="controls"></div>
<div id="content"><div class="loading">Loading…</div></div>
<script>
const API = '/api';
let state = { view: 'directories', dir: '', file: '' };

function fmtTime(start, end) {
  if (!start) return '—';
  const s = new Date(start);
  const e = end ? new Date(end) : null;
  const opts = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
  if (e && s.toDateString() === e.toDateString()) {
    return s.toLocaleString('en-US', opts) + ' → ' + e.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit' });
  }
  if (e) {
    return s.toLocaleString('en-US', opts) + ' → ' + e.toLocaleString('en-US', opts);
  }
  return s.toLocaleString('en-US', opts);
}

function displayDir(raw) {
  // Transform --home-deepmind--projects-llm-dashboard-- → ~/projects/llm-dashboard/
  let name = raw.replace(/^--home-deepmind--/, '~/');
  name = name.replace(/^--home-deepmind-/, '~/');
  name = name.replace(/--/g, '/');
  if (name.startsWith('~')) return name;
  // For unknown bases, just show raw
  return '📁 ' + raw;
}

function breadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (state.view === 'directories') {
    bc.innerHTML = '<span onclick="goDirectories()">📁 Sessions</span>';
  } else if (state.view === 'list') {
    bc.innerHTML = `<span onclick="goDirectories()">📁 Sessions</span><span class="sep">›</span><span>${displayDir(state.dir)}</span>`;
  } else {
    bc.innerHTML = `<span onclick="goDirectories()">📁 Sessions</span><span class="sep">›</span><span onclick="goList()">${displayDir(state.dir)}</span><span class="sep">›</span><span>${state.file.slice(0, 30)}…</span>`;
  }
}

function goDirectories() { state = { view: 'directories', dir: '', file: '' }; render(); }
function goList() { state = { view: 'list', dir: state.dir, file: '' }; render(); }

async function fetchJSON(path) {
  try {
    const r = await fetch(API + path);
    if (!r.ok) {
      console.error('API error:', path, r.status);
      content.innerHTML = '<div class="loading">Error: ' + r.status + ' ' + r.statusText + '<br>Path: ' + path + '</div>';
      return null;
    }
    return await r.json();
  } catch (e) {
    console.error('Fetch failed:', path, e);
    const c = document.getElementById('content');
    if (c) c.innerHTML = '<div class="loading">Network error: ' + e.message + '<br>Path: ' + path + '</div>';
    return null;
  }
}

async function refresh() {
  if (state.view === 'directories') renderDirectories();
  else if (state.view === 'list') renderList();
  else renderParse();
}

async function renderDirectories() {
  const content = document.getElementById('content');
  const controls = document.getElementById('controls');
  controls.innerHTML = '';
  content.innerHTML = '<div class="loading">Loading directories…</div>';
  let dirs = null;
  try {
    const r = await fetch(API + '/sessions/directories');
    const text = await r.text();
    console.log('API response:', text.substring(0, 200));
    if (!r.ok) {
      content.innerHTML = '<div class="loading">Error: ' + r.status + ' ' + r.statusText + '<br>Response: ' + text.substring(0, 200) + '</div>';
      return;
    }
    try { dirs = JSON.parse(text); }
    catch (e) {
      content.innerHTML = '<div class="loading">JSON parse error: ' + e.message + '<br>Response: ' + text.substring(0, 200) + '</div>';
      return;
    }
  } catch (e) {
    content.innerHTML = '<div class="loading">Fetch error: ' + e.message + '</div>';
    return;
  }
  if (!dirs || dirs.length === 0) {
    content.innerHTML = '<div class="loading">No session directories found<br>Response was: ' + JSON.stringify(dirs) + '</div>';
    return;
  }
  // Sort by session count, highest to lowest
  dirs.sort((a, b) => b.count - a.count);
  content.innerHTML = '<div class="tile-grid">' +
    dirs.map(d => `<div class="tile" onclick="openDir('${d.name.replace(/'/g, "\\'")}')">
      <div class="tile-cwd">${displayDir(d.name)}</div>
      <div class="tile-name">${d.count} session${d.count !== 1 ? 's' : ''}</div>
    </div>`).join('') +
    '</div>';
  breadcrumb();
}

function openDir(dir) { state = { view: 'list', dir, file: '' }; renderList(); }

async function renderList() {
  const content = document.getElementById('content');
  const controls = document.getElementById('controls');
  controls.innerHTML = '<button class="back-btn" onclick="goDirectories()">← Back</button>';
  content.innerHTML = '<div class="loading">Loading sessions for ' + displayDir(state.dir) + '…</div>';
  let sessions = null;
  try {
    const r = await fetch(API + '/sessions/list?dir=' + encodeURIComponent(state.dir));
    const text = await r.text();
    if (!r.ok) {
      content.innerHTML = '<div class="error">API error: ' + r.status + ' ' + r.statusText + '<br>Response: ' + text.substring(0, 300) + '</div>';
      return;
    }
    try { sessions = JSON.parse(text); }
    catch (e) {
      content.innerHTML = '<div class="error">JSON parse error: ' + e.message + '<br>Response: ' + text.substring(0, 300) + '</div>';
      return;
    }
  } catch (e) {
    content.innerHTML = '<div class="error">Fetch error: ' + e.message + '</div>';
    return;
  }
  if (!sessions || sessions.length === 0) {
    content.innerHTML = '<div class="loading">No sessions found in ' + displayDir(state.dir) + '</div>';
    return;
  }
  // Sort by timestamp, newest first
  sessions.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
  content.innerHTML = '<div class="session-list">' +
    sessions.map(s => `<div class="session-row" onclick="openSession('${s.name.replace(/'/g, "\\'")}')">
      <div class="session-id" title="${s.id}">${s.id}</div>
      <div class="session-brief" title="${escapeHtml(s.brief || '')}">${escapeHtml(s.brief || '')}</div>
      <div class="session-time">${fmtTime(s.timestamp, s.lastTimestamp)}</div>
    </div>`).join('') +
    '</div>';
  breadcrumb();
}

function openSession(name) { state = { view: 'parse', dir: state.dir, file: name }; renderParse(); }

async function renderParse() {
  const content = document.getElementById('content');
  const controls = document.getElementById('controls');
  controls.innerHTML = '<button class="back-btn" onclick="goList()">← Back</button>';
  content.innerHTML = '<div class="loading">Loading session ' + state.file + '…</div>';
  let parsed = null;
  try {
    const filePath = state.dir + '/' + state.file;
    const r = await fetch(API + '/sessions/parse?file=' + encodeURIComponent(filePath));
    const text = await r.text();
    if (!r.ok) {
      content.innerHTML = '<div class="error">API error: ' + r.status + ' ' + r.statusText + '<br>File: ' + filePath + '<br>Response: ' + text.substring(0, 300) + '</div>';
      return;
    }
    try { parsed = JSON.parse(text); }
    catch (e) {
      content.innerHTML = '<div class="error">JSON parse error: ' + e.message + '<br>Response: ' + text.substring(0, 300) + '</div>';
      return;
    }
  } catch (e) {
    content.innerHTML = '<div class="error">Fetch error: ' + e.message + '</div>';
    return;
  }
  const config = {
    user:    { emoji: '📝', label: 'User Messages' },
    assistant: { emoji: '💬', label: 'Assistant Messages' },
    toolCall:  { emoji: '🔧', label: 'Tool Calls' },
    thinking:  { emoji: '🧠', label: 'Thinking' },
    toolResult:{ emoji: '📤', label: 'Tool Results' },
    custom:    { emoji: '🔌', label: 'Custom Events' },
    compaction:{ emoji: '📦', label: 'Compactions' },
    other:     { emoji: '📄', label: 'Other Events' },
  };
  let html = '';
  let hasAny = false;
  for (const [type, entries] of Object.entries(parsed)) {
    if (!entries || entries.length === 0) continue;
    hasAny = true;
    const cfg = config[type] || { emoji: '📄', label: type };
    html += `<div class="group"><div class="group-header">${cfg.emoji} ${cfg.label} <span class="group-badge ${type}">${entries.length}</span></div>`;
    for (const entry of entries) {
      html += `<div class="brief" onclick="this.classList.toggle('expanded')">${escapeHtml(entry.brief)}</div>
<div class="brief-full">${escapeHtml(entry.full)}</div>`;
    }
    html += `</div>`;
  }
  content.innerHTML = hasAny ? html : '<div class="loading">No entries found</div>';
  breadcrumb();
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function render() {
  breadcrumb();
  if (state.view === 'directories') renderDirectories();
  else if (state.view === 'list') renderList();
  else renderParse();
}
render();
</script>
</body>
</html>
