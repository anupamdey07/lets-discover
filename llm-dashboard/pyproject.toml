[project]
name = "llm-dashboard"
version = "0.1.0"
description = "Textual TUI dashboard for managing local LLM inference servers"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0.0",
    "nvidia-ml-py>=13.0",
    "psutil>=5.9",
    "httpx>=0.28",
    "fastapi>=0.139",
    "uvicorn>=0.49",
]

[project.scripts]
llm-dashboard = "dashboard.__main__:main"
llm-dashboard-web = "dashboard.web:main"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
